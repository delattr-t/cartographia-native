workflows:
  react-native-android:
    name: React Native Android
    max_build_duration: 60
    environment:
      groups:
        - expo
      node: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build Android
        script: |
          npx expo prebuild
          cd android
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab
    publishing:
      email:
        recipients:
          - thibaut.delattre@protonmail.com
